<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>QuizMaster Leaderboard</title>
<style>body{font-family:system-ui;margin:0;padding:20px;background:#f5f7fb;color:#17324d}.card{max-width:900px;margin:0 auto 20px;background:#fff;padding:20px;border-radius:14px;box-shadow:0 2px 10px #0001}h1{margin-top:0}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.bar select,.bar button{padding:10px;border:1px solid #d7e1ed;border-radius:8px}.bar button{background:#1565c0;color:#fff;border:0;font-weight:600;cursor:pointer}.back{background:#fff!important;color:#1565c0!important;border:1px solid #1565c0!important}.row{display:grid;grid-template-columns:55px 1fr 90px 90px 100px;gap:10px;align-items:center;padding:14px 8px;border-bottom:1px solid #e6edf5}.head{font-weight:700;background:#eef4fa;border-radius:8px}.rank{font-weight:800}.badge{display:inline-block;padding:4px 8px;border-radius:6px;background:#e3f2fd;color:#1565c0}.muted{color:#6b7c93}.error{color:#b00020}.hidden{display:none}@media(max-width:650px){.row{grid-template-columns:42px 1fr 70px 70px}.row .tests{display:none}.head .tests{display:none}}</style></head><body>
<div id="login" class="card"><h1>QuizMaster Student Leaderboard</h1><p class="muted">Teacher-only leaderboard.</p><p id="error" class="error"></p></div>
<div id="page" class="hidden"><div class="card"><h1>Student Leaderboard</h1><p class="muted">Ranked by average percentage. Ties are broken by number of tests, then total correct answers.</p><div class="bar"><button class="back" onclick="backToDashboard()">← Back to Dashboard</button><label>Class <select id="classFilter" onchange="render()"><option value="all">All</option><option value="11">Class 11</option><option value="12">Class 12</option></select></label><button onclick="load()">Refresh</button><button onclick="logout()">Logout</button></div></div><div class="card"><div id="board">Loading...</div></div></div>
<script>const API=location.origin+"/api";let token=localStorage.getItem("quizmaster_teacher_token")||"",students=[];function headers(){return token?{Authorization:"Bearer "+token}:{};}async function load(){try{const r=await fetch(API+"/students/report",{headers:headers()});if(r.status===401){logout();return}if(!r.ok)throw new Error();const d=await r.json();students=(d.students||[]).filter(s=>(s.tests||[]).length>0);render()}catch(e){document.getElementById("board").innerHTML='<p class="error">Failed to load leaderboard.</p>'}}function render(){const f=document.getElementById("classFilter").value;const list=students.filter(s=>f==="all"||String(s.class_level)===f).map(s=>({...s,testsCount:(s.tests||[]).length,avg:Number(s.average_percentage||0),correct:Number(s.total_correct||0)})).sort((a,b)=>b.avg-a.avg||b.testsCount-a.testsCount||b.correct-a.correct||String(a.name).localeCompare(String(b.name))).slice(0,50);const box=document.getElementById("board");if(!list.length){box.innerHTML='<p class="muted">No completed tests for this class yet.</p>';return}let h='<div class="row head"><span>Rank</span><span>Student</span><span>Average</span><span class="tests">Tests</span><span>Class</span></div>';list.forEach((s,i)=>{h+=`<div class="row"><span class="rank">${i+1}</span><span><b>${esc(s.name)}</b><br><small class="muted">Roll ${esc(s.roll||"-")}</small></span><span><b>${s.avg}%</b></span><span class="tests">${s.testsCount}</span><span><span class="badge">${s.class_level?"Class "+s.class_level:"-"}</span></span></div>`});box.innerHTML=h}function esc(v){return String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}function backToDashboard(){location.href="/"}async function check(){if(!token){document.getElementById("error").textContent="Teacher login required. Open the teacher dashboard and log in first.";return}try{const r=await fetch(API+"/auth/me",{headers:headers()});const d=await r.json();if(r.ok&&d.user?.role==="teacher"){document.getElementById("login").classList.add("hidden");document.getElementById("page").classList.remove("hidden");load()}else throw new Error()}catch(e){document.getElementById("error").textContent="Teacher login required. Open the teacher dashboard and log in first."}}async function logout(){if(token)await fetch(API+"/auth/logout",{method:"POST",headers:headers()}).catch(()=>{});localStorage.removeItem("quizmaster_teacher_token");location.href="/"}check();</script></body></html>
