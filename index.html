<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>QuizMaster Admin</title>

<style>
body{
  font-family:system-ui;
  margin:0;
  padding:20px;
  background:#f5f5f5;
}
.card{
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:10px;
}
input,textarea,button{
  display:block;
  width:100%;
  box-sizing:border-box;
  margin:8px 0;
  padding:10px;
}
button{
  cursor:pointer;
}
.question{
  border:1px solid #ddd;
  padding:15px;
  margin:10px 0;
  border-radius:8px;
}
</style>
</head>

<body>

<h1>QuizMaster Admin</h1>

<div class="card">
<h2>Create Quiz</h2>

<input id="title" placeholder="Quiz title">

<textarea id="description" placeholder="Description"></textarea>

<input id="duration" type="number" placeholder="Duration in minutes" value="10">

<div id="questions"></div>

<button onclick="add()">Add Question</button>

<button onclick="create()">Create Quiz</button>
</div>

<div class="card">
<h2>Existing Quizzes</h2>

<div id="list">Loading...</div>
</div>

<script>

const API = location.origin + "/api";

let questions = [];


function add(){

  questions.push({
    text:"",
    options:["","","",""],
    correct:0
  });

  draw();
}


function draw(){

  const box = document.getElementById("questions");

  box.innerHTML = "";

  questions.forEach((q,i)=>{

    box.insertAdjacentHTML(
      "beforeend",

      `
      <div class="question">

        <b>Question ${i+1}</b>

        <textarea
          placeholder="Question"
          oninput="questions[${i}].text=this.value"
        >${q.text}</textarea>

        <input
          placeholder="Option A"
          oninput="questions[${i}].options[0]=this.value"
          value="${q.options[0]}"
        >

        <input
          placeholder="Option B"
          oninput="questions[${i}].options[1]=this.value"
          value="${q.options[1]}"
        >

        <input
          placeholder="Option C"
          oninput="questions[${i}].options[2]=this.value"
          value="${q.options[2]}"
        >

        <input
          placeholder="Option D"
          oninput="questions[${i}].options[3]=this.value"
          value="${q.options[3]}"
        >

        <select onchange="questions[${i}].correct=Number(this.value)">

          <option value="0" ${q.correct===0?"selected":""}>
            Correct answer: A
          </option>

          <option value="1" ${q.correct===1?"selected":""}>
            Correct answer: B
          </option>

          <option value="2" ${q.correct===2?"selected":""}>
            Correct answer: C
          </option>

          <option value="3" ${q.correct===3?"selected":""}>
            Correct answer: D
          </option>

        </select>

      </div>
      `
    );

  });
}


async function create(){

  if(!document.getElementById("title").value.trim()){
    alert("Enter a quiz title.");
    return;
  }

  if(questions.length===0){
    alert("Add at least one question.");
    return;
  }

  const data = {

    title:document.getElementById("title").value,

    description:document.getElementById("description").value,

    duration:Number(document.getElementById("duration").value)||10,

    questions:questions

  };


  const response = await fetch(
    API + "/quizzes",
    {
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify(data)
    }
  );


  if(!response.ok){

    alert("Failed to create quiz.");

    return;
  }


  alert("Quiz created successfully.");

  document.getElementById("title").value="";
  document.getElementById("description").value="";

  questions=[];

  draw();

  load();
}


async function load(){

  const response = await fetch(API + "/quizzes");

  const data = await response.json();

  const box = document.getElementById("list");

  box.innerHTML="";


  if(data.length===0){

    box.innerHTML="<p>No quizzes created yet.</p>";

    return;
  }


  data.forEach(q=>{

    box.insertAdjacentHTML(

      "beforeend",

      `
      <div class="question">

        <b>${q.title}</b>

        <p>${q.description || ""}</p>

        <p>
          Duration: ${q.duration} minutes
        </p>

        <p>
          Status:
          ${q.published ? "Published" : "Not published"}
        </p>

        ${
          q.published
          ?
          `<button onclick="pub(${q.id},false)">
             Unpublish
           </button>`
          :
          `<button onclick="pub(${q.id},true)">
             Publish
           </button>`
        }

      </div>
      `
    );

  });

}


async function pub(id,value){

  const response = await fetch(

    API + "/quizzes/" + id + "/publish",

    {
      method:"PATCH",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        published:value
      })
    }

  );


  if(!response.ok){

    alert("Failed to change quiz status.");

    return;
  }


  load();
}


add();

load();

</script>

</body>
</html>
