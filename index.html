<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>QuizMaster Admin</title>
<style>
body{font-family:system-ui;margin:0;padding:20px;background:#f5f7fb;color:#17324d}.card{background:white;padding:20px;margin-bottom:20px;border-radius:12px;box-shadow:0 2px 10px #0000000d}input,textarea,button,select{display:block;width:100%;box-sizing:border-box;margin:8px 0;padding:10px;border:1px solid #d7e1ed;border-radius:8px}button{cursor:pointer;background:#1565c0;color:white;border:0;font-weight:600}.question{border:1px solid #dde5ee;padding:15px;margin:10px 0;border-radius:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{width:auto;min-width:110px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{border:1px solid #ddd;padding:10px;text-align:left}th{background:#eef4fa}.empty{color:#666}.hidden{display:none}.error{color:#b00020}.badge{display:inline-block;padding:4px 8px;border-radius:6px;background:#e3f2fd;color:#1565c0}.student-card{border:1px solid #dbe5ef;padding:16px;margin:12px 0;border-radius:10px}.student-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.student-head h3{margin:0}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.stat{background:#f4f7fb;padding:8px 12px;border-radius:8px;font-size:13px}.details{margin-top:12px}.details summary{cursor:pointer;font-weight:700;color:#1565c0}.mini{font-size:13px;color:#6b7c93}.success{color:#16845a}
</style></head><body>
<div id="login" class="card"><h1>QuizMaster Teacher Login</h1><input id="username" placeholder="Teacher username" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Login</button><p id="loginError" class="error"></p></div>
<div id="dashboard" class="hidden"><h1>QuizMaster Teacher Dashboard</h1><div class="card"><p>Logged in as <b id="who"></b></p><button onclick="logout()">Logout</button></div>
<div class="card"><h2>Create Quiz</h2><input id="title" placeholder="Quiz title"><textarea id="description" placeholder="Description"></textarea><select id="classLevel"><option value="">Select class</option><option value="11">Class 11</option><option value="12">Class 12</option></select><input id="duration" type="number" placeholder="Duration in minutes" value="10"><div id="questions"></div><button onclick="add()">Add Question</button><button onclick="create()">Create Quiz</button></div>
<div class="card"><h2>Existing Quizzes</h2><div id="list">Loading...</div></div>
<div class="card"><h2>Student Performance</h2><p class="mini">Every student is shown with all tests they have submitted, including score, percentage, class and submission time.</p><button onclick="loadStudentReport()">Refresh Student Report</button><div id="studentReport">Loading...</div></div>
<div class="card"><h2>Student Results</h2><button onclick="loadResults()">Refresh Results</button><div id="results">Loading...</div></div></div>
<script>
const API=location.origin+"/api";let questions=[],editingId=null,token=localStorage.getItem("quizmaster_teacher_token")||"";
function headers(json=true){const h={};if(json)h["Content-Type"]="application/json";if(token)h.Authorization="Bearer "+token;return h}
function showDashboard(user){document.getElementById("login").classList.add("hidden");document.getElementById("dashboard").classList.remove("hidden");document.getElementById("who").textContent=user?.name||user?.username||"Teacher";add();load();loadResults();loadStudentReport()}
async function login(){const err=document.getElementById("loginError");err.textContent="";try{const r=await fetch(API+"/auth/login",{method:"POST",headers:headers(),body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});const d=await r.json();if(!r.ok)throw new Error(d.error||"Login failed");if(d.user.role!=="teacher")throw new Error("This account is not a teacher account");token=d.token;localStorage.setItem("quizmaster_teacher_token",token);showDashboard(d.user)}catch(e){err.textContent=e.message}}
async function logout(){if(token)await fetch(API+"/auth/logout",{method:"POST",headers:headers()}).catch(()=>{});token="";localStorage.removeItem("quizmaster_teacher_token");location.reload()}
async function checkSession(){if(!token)return;try{const r=await fetch(API+"/auth/me",{headers:headers(false)});const d=await r.json();if(r.ok&&d.user.role==="teacher")showDashboard(d.user);else throw new Error()}catch(e){token="";localStorage.removeItem("quizmaster_teacher_token")}}
function add(){questions.push({text:"",options:["","","",""],correct:0});draw()}
function draw(){const box=document.getElementById("questions");box.innerHTML="";questions.forEach((q,i)=>box.insertAdjacentHTML("beforeend",`<div class="question"><b>Question ${i+1}</b><textarea placeholder="Question" oninput="questions[${i}].text=this.value">${escapeHtml(q.text)}</textarea><input placeholder="Option A" oninput="questions[${i}].options[0]=this.value" value="${escapeHtml(q.options[0])}"><input placeholder="Option B" oninput="questions[${i}].options[1]=this.value" value="${escapeHtml(q.options[1])}"><input placeholder="Option C" oninput="questions[${i}].options[2]=this.value" value="${escapeHtml(q.options[2])}"><input placeholder="Option D" oninput="questions[${i}].options[3]=this.value" value="${escapeHtml(q.options[3])}"><select onchange="questions[${i}].correct=Number(this.value)"><option value="0" ${q.correct===0?"selected":""}>Correct answer: A</option><option value="1" ${q.correct===1?"selected":""}>Correct answer: B</option><option value="2" ${q.correct===2?"selected":""}>Correct answer: C</option><option value="3" ${q.correct===3?"selected":""}>Correct answer: D</option></select></div>`))}
function resetForm(){editingId=null;document.getElementById("title").value="";document.getElementById("description").value="";document.getElementById("classLevel").value="";document.getElementById("duration").value="10";questions=[];draw();document.querySelector('button[onclick="create()"]')?.replaceChildren(document.createTextNode("Create Quiz"))}
async function create(){const title=document.getElementById("title").value.trim(),classLevel=document.getElementById("classLevel").value;if(!title){alert("Enter a quiz title.");return}if(!classLevel){alert("Select Class 11 or Class 12.");return}if(questions.length===0){alert("Add at least one question.");return}const payload={title,description:document.getElementById("description").value,duration:Number(document.getElementById("duration").value)||10,classLevel:Number(classLevel),questions};const url=editingId?API+"/quizzes/"+editingId:API+"/quizzes";const r=await fetch(url,{method:editingId?"PUT":"POST",headers:headers(),body:JSON.stringify(payload)});if(r.status===401)return logout();if(!r.ok){const d=await r.json().catch(()=>({}));alert(d.error||(editingId?"Failed to update quiz.":"Failed to create quiz."));return}alert(editingId?"Quiz updated successfully.":"Quiz created successfully.");resetForm();load()}
async function load(){try{const r=await fetch(API+"/quizzes",{headers:headers(false)});if(r.status===401)return logout();if(!r.ok)throw new Error();const data=await r.json(),box=document.getElementById("list");box.innerHTML="";if(data.length===0){box.innerHTML="<p>No quizzes created yet.</p>";return}data.forEach(q=>box.insertAdjacentHTML("beforeend",`<div class="question"><b>${escapeHtml(q.title)}</b><p>${escapeHtml(q.description||"")}</p><p>Class: <span class="badge">${q.class_level===11?"11":q.class_level===12?"12":"Unassigned"}</span></p><p>Duration: ${q.duration} minutes</p><p>Status: ${q.published?"Published":"Not published"}</p><div class="actions">${q.published?`<button onclick="pub(${q.id},false)">Unpublish</button>`:`<button onclick="pub(${q.id},true)">Publish</button>`}<button onclick="editQuiz(${q.id})">Edit</button><button onclick="deleteQuiz(${q.id})">Delete</button></div></div>`))}catch(e){document.getElementById("list").innerHTML="<p>Failed to load quizzes.</p>"}}
async function editQuiz(id){try{const r=await fetch(API+"/quizzes/"+id,{headers:headers(false)});if(!r.ok)throw new Error();const q=await r.json();editingId=id;document.getElementById("title").value=q.title||"";document.getElementById("description").value=q.description||"";document.getElementById("classLevel").value=q.class_level||"";document.getElementById("duration").value=q.duration||10;questions=q.questions.map(x=>({text:x.text||"",options:[x.a||"",x.b||"",x.c||"",x.d||""],correct:Number(x.correct)||0}));draw();document.querySelector('button[onclick="create()"]')?.replaceChildren(document.createTextNode("Update Quiz"));window.scrollTo({top:0,behavior:"smooth"})}catch(e){alert("Failed to load quiz for editing. If this is an older quiz, select its class before updating it.")}}
async function deleteQuiz(id){const quiz=await fetch(API+"/quizzes/"+id,{headers:headers(false)}).then(r=>r.ok?r.json():null).catch(()=>null);const title=quiz?.title||("Quiz #"+id);if(!confirm("Delete \""+title+"\"? This will also delete its questions and saved student results."))return;const r=await fetch(API+"/quizzes/"+id,{method:"DELETE",headers:headers(false)});if(r.status===401)return logout();if(!r.ok){alert("Failed to delete quiz.");return}if(editingId===id)resetForm();load();loadResults();loadStudentReport()}
async function pub(id,value){const r=await fetch(API+"/quizzes/"+id+"/publish",{method:"PATCH",headers:headers(),body:JSON.stringify({published:value})});if(r.status===401)return logout();if(!r.ok){alert("Failed to change quiz status.");return}load()}
function formatDate(v){if(!v)return "-";const d=new Date(v);return isNaN(d.getTime())?v:d.toLocaleString()}
function classLabel(v){return v===11||v==="11"?"11":v===12||v==="12"?"12":"-"}
async function loadStudentReport(){const box=document.getElementById("studentReport");if(!box)return;box.innerHTML="Loading...";try{const r=await fetch(API+"/students/report",{headers:headers(false)});if(r.status===401)return logout();if(!r.ok)throw new Error();const data=await r.json();if(!data.students||data.students.length===0){box.innerHTML='<p class="empty">No students registered yet.</p>';return}let html="";data.students.forEach(s=>{const tests=s.tests||[];html+=`<div class="student-card"><div class="student-head"><div><h3>${escapeHtml(s.name)}</h3><div class="mini">Roll No. ${escapeHtml(s.roll||"-")} · Username: ${escapeHtml(s.username||"-")} · Class ${classLabel(s.class_level)}</div></div><span class="badge">${tests.length} test${tests.length===1?"":"s"}</span></div><div class="stats"><span class="stat">Tests taken: <b>${tests.length}</b></span><span class="stat">Average: <b>${s.average_percentage||0}%</b></span><span class="stat">Correct: <b>${s.total_correct||0}/${s.total_questions||0}</b></span><span class="stat">Last test: <b>${formatDate(s.last_test_at)}</b></span></div><details class="details"><summary>View all tests for ${escapeHtml(s.name)}</summary>${tests.length?`<div class="table-wrap"><table><thead><tr><th>Test</th><th>Class</th><th>Score</th><th>Percentage</th><th>Submitted</th></tr></thead><tbody>${tests.map(t=>`<tr><td>${escapeHtml(t.title||("Quiz #"+t.quiz_id))}</td><td>${classLabel(t.class_level)}</td><td>${t.score}/${t.total}</td><td>${t.percentage}%</td><td>${formatDate(t.submitted_at)}</td></tr>`).join("")}</tbody></table></div>`:'<p class="empty">This student has not submitted any test yet.</p>'}</details></div>`});box.innerHTML=html}catch(e){box.innerHTML='<p class="error">Failed to load student report. Please try again.</p>'}}
async function loadResults(){const box=document.getElementById("results");if(!box)return;box.innerHTML="Loading...";try{const [rr,qr]=await Promise.all([fetch(API+"/results",{headers:headers(false)}),fetch(API+"/quizzes",{headers:headers(false)})]);if(rr.status===401)return logout();if(!rr.ok||!qr.ok)throw new Error();const results=await rr.json(),quizzes=await qr.json(),names={};quizzes.forEach(q=>names[q.id]=q.title);if(results.length===0){box.innerHTML='<p class="empty">No student results yet.</p>';return}let html='<div class="table-wrap"><table><thead><tr><th>Student</th><th>Roll No.</th><th>Class</th><th>Quiz</th><th>Score</th><th>Percentage</th><th>Submitted</th></tr></thead><tbody>';results.forEach(r=>{const q=quizzes.find(x=>x.id===r.quiz_id);html+=`<tr><td>${escapeHtml(r.student)}</td><td>${escapeHtml(r.roll)}</td><td>${classLabel(q?.class_level)}</td><td>${escapeHtml(names[r.quiz_id]||("Quiz #"+r.quiz_id))}</td><td>${r.score}/${r.total}</td><td>${r.percentage}%</td><td>${formatDate(r.submitted_at)}</td></tr>`});box.innerHTML=html+'</tbody></table></div>'}catch(e){box.innerHTML='<p>Failed to load results. Please try again.</p>'}}
function escapeHtml(v){return String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
checkSession();
</script></body></html>
