<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>QuizMaster Admin</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}main{max-width:1000px;margin:30px auto;padding:20px}.card{background:white;padding:20px;border-radius:14px;margin:14px 0;box-shadow:0 3px 14px #0001}input,textarea{width:100%;padding:10px;margin:5px 0 12px;box-sizing:border-box}button{padding:10px 14px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:700;margin:4px;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><main><div class=card><h1>QuizMaster Admin</h1><p>Create and publish online quizzes. Results are stored on the server.</p><input id=t placeholder="Quiz title"><textarea id=d placeholder="Description"></textarea><input id=dur type=number value=10 placeholder="Duration minutes"><div id=qs></div><button onclick=add()>+ Add MCQ</button><button onclick=create()>Create Quiz</button></div><div class=card><h2>Quizzes</h2><div id=list></div></div><div class=card><h2>Student Results</h2><div id=res></div></div></main><script>
const API=location.protocol+"//"+location.hostname+":3000/api";let questions=[];
function add(){questions.push({text:"",options:["","","",""],correct:0});draw()}
function draw(){qs.innerHTML=questions.map((q,i)=>`<div class=card><b>Question ${i+1}</b><textarea placeholder="Question" oninput="questions[${i}].text=this.value">${q.text}</textarea>${q.options.map((o,j)=>`<input placeholder="Option ${String.fromCharCode(65+j)}" value="${o}" oninput="questions[${i}].options[${j}]=this.value"><label><input type=radio name=c${i} ${q.correct==j?"checked":""} onchange="questions[${i}].correct=${j}" style="width:auto"> Correct</label>`).join("")}</div>`).join("")}
async function create(){let r=await fetch(API+"/quizzes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:t.value,description:d.value,duration:+dur.value,questions})});if(r.ok){questions=[];t.value="";d.value="";draw();load()}else alert("Could not create quiz")}
async function load(){let q=await (await fetch(API+"/quizzes")).json();list.innerHTML=q.map(x=>`<div><b>${x.title}</b> — ${x.questions||""} <button onclick="pub(${x.id},${!x.published})">${x.published?"Unpublish":"Publish"}</button></div>`).join("");let rr=await(await fetch(API+"/results")).json();res.innerHTML=rr.length?`<table><tr><th>Student</th><th>Roll</th><th>Quiz ID</th><th>Score</th><th>%</th><th>Time</th></tr>${rr.map(x=>`<tr><td>${x.student}</td><td>${x.roll||""}</td><td>${x.quiz_id}</td><td>${x.score}/${x.total}</td><td>${x.percentage}%</td><td>${new Date(x.submitted_at).toLocaleString()}</td></tr>`).join("")}</table>`:"No results yet."}
async function pub(id,v){await fetch(API+"/quizzes/"+id+"/publish",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({published:v})});load()}add();load();
</script></body></html>
