name: QuizMaster Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: require
    steps:
      - name: Verify database secret
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL GitHub secret is not configured"; exit 1; }

      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version
          test "$(/usr/lib/postgresql/18/bin/pg_dump --version | awk '{print $3}' | cut -d. -f1)" = "18"

      - name: Create PostgreSQL backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl --file="backup/quizmaster-${stamp}.dump"
          ls -lh backup/

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizMaster-Database-Backup-${{ github.run_number }}
          path: backup/*.dump
          if-no-files-found: error
          retention-days: 30
