name: QuizMaster Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read

jobs:
  backup:
    # Use the official PostgreSQL 18 image so pg_dump cannot accidentally
    # resolve to Ubuntu's PostgreSQL 16 client.
    runs-on: ubuntu-latest
    container: postgres:18
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PGSSLMODE: require
    steps:
      - name: Verify database secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL" || { echo "DATABASE_URL GitHub secret is not configured"; exit 1; }

      - name: Verify PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          pg_dump --version
          test "$(pg_dump --version | awk '{print $3}' | cut -d. -f1)" = "18"

      - name: Create PostgreSQL backup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          stamp="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-acl \
            --file="backup/quizmaster-${stamp}.dump"
          test -s "backup/quizmaster-${stamp}.dump"
          ls -lh backup/

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizMaster-Database-Backup-${{ github.run_number }}
          path: backup/*.dump
          if-no-files-found: error
          retention-days: 30
